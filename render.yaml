services:
  - type: web
    name: mausam-weather-app
    runtime: python
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_NAME
        value: Mausam
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: sqlite:///./mausam.db
      - key: WEATHER_CACHE_TTL
        value: "600"
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
    healthCheckPath: /health
    autoDeploy: true
